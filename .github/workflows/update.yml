name: 更新直播源

on:
  schedule:
    # GitHub 用 UTC：2、10、18 点 = 北京时间 10:00、18:00、02:00（每天 2:00 起，每 8 小时一次）
    - cron: "0 18,2,10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-iptv
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 生成 iptv.m3u / iptv.txt
        run: python3 scripts/update.py
      - name: 有变化就提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iptv.m3u iptv.txt
          if git diff --cached --quiet; then
            echo "直播源没有变化"
          else
            git commit -m "自动更新直播源 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git push
          fi
